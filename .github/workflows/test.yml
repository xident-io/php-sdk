name: Test

# The version guard below runs on `push.tags` because that is the last gate
# before a tag becomes public. Composer has no upload step — Packagist ingests
# tags from the repository — so once a tag exists it will be picked up, and the
# only real remedy for a bad one is to delete the tag.
#
# An earlier version of this comment claimed Packagist auto-updates this repo
# via a GitHub hook. It does not. `gh api repos/xident-io/php-sdk/hooks` returns
# an empty list, which is why Packagist flags the package "Not Auto-Updated,
# Needs Attention". release.yml now pushes the update explicitly.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the LOW end equal to composer.json's require.php floor. That is
        # what catches syntax the floor does not support — `readonly class` is
        # 8.2, and a manifest claiming 8.1 shipped nine unparseable files.
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover build/clover.xml

      # The floor is a ratchet: raise it when coverage rises, never lower it.
      - name: Enforce the coverage floor
        run: php scripts/check-coverage.php build/clover.xml 100

  version:
    name: Version matches the tag
    runs-on: ubuntu-latest
    # Only meaningful on a tag push — that is the moment the constant and the
    # tag can disagree, and the moment Packagist reads the tag.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Check Config::SDK_VERSION against ${{ github.ref_name }}
        run: php scripts/check-version.php "${GITHUB_REF_NAME}"
